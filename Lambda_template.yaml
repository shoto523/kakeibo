AWSTemplateFormatVersion: '2010-09-09'
Description: Kakeibo Lambda FINAL (Cognitoグループ単位共有 / 登録者本人のみ削除)

Parameters:
  KakeiboTableName:
    Type: String
    Default: kakeibo-db

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: KakeiboLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${KakeiboTableName}

  KakeiboLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: KakeiboLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref KakeiboTableName
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import uuid
          from boto3.dynamodb.conditions import Key
          from decimal import Decimal

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          CORS_HEADERS = {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "OPTIONS,GET,POST,DELETE"
          }

          def convert_decimal(obj):
              if isinstance(obj, list):
                  return [convert_decimal(i) for i in obj]
              if isinstance(obj, dict):
                  return {k: convert_decimal(v) for k, v in obj.items()}
              if isinstance(obj, Decimal):
                  return int(obj)
              return obj

          def get_http_method(event):
              if "httpMethod" in event:
                  return event["httpMethod"]
              method = event.get("requestContext", {}).get("http", {}).get("method")
              if method:
                  return method
              route_key = event.get("routeKey")
              if route_key and " " in route_key:
                  return route_key.split(" ")[0]
              return None

          def get_claims(event):
              return event.get("requestContext", {}).get("authorizer", {}).get("claims")

          def get_group_id(claims):
              groups = claims.get("cognito:groups")
              if isinstance(groups, list) and groups:
                  return groups[0]
              if isinstance(groups, str):
                  return groups.split(",")[0]
              return None

          def get_items(groupId):
              resp = table.query(
                  KeyConditionExpression=Key("groupId").eq(groupId),
                  ConsistentRead=True
              )
              return convert_decimal(resp.get("Items", []))

          def handler(event, context):
              try:
                  method = get_http_method(event)

                  if method is None or method == "OPTIONS":
                      return {"statusCode": 200, "headers": CORS_HEADERS, "body": ""}

                  claims = get_claims(event)
                  if not claims:
                      return {"statusCode": 401, "headers": CORS_HEADERS, "body": json.dumps({"error": "Unauthorized"})}

                  groupId = get_group_id(claims)
                  if not groupId:
                      return {"statusCode": 403, "headers": CORS_HEADERS, "body": json.dumps({"error": "No group"})}

                  username = claims.get("cognito:username")

                  if method == "GET":
                      return {"statusCode": 200, "headers": CORS_HEADERS, "body": json.dumps(get_items(groupId))}

                  if method == "POST":
                      body = json.loads(event.get("body") or "{}")
                      table.put_item(
                          Item={
                              "groupId": groupId,
                              "entryId": str(uuid.uuid4()),
                              "date": body.get("date"),
                              "item": body.get("item"),
                              "amount": Decimal(str(body.get("amount"))),
                              "registrant": username
                          }
                      )
                      return {"statusCode": 200, "headers": CORS_HEADERS, "body": json.dumps(get_items(groupId))}

                  if method == "DELETE":
                      entryId = event.get("pathParameters", {}).get("id")
                      resp = table.get_item(Key={"groupId": groupId, "entryId": entryId})
                      item = resp.get("Item")
                      if not item or item.get("registrant") != username:
                          return {"statusCode": 403, "headers": CORS_HEADERS, "body": json.dumps({"error": "Forbidden"})}
                      table.delete_item(Key={"groupId": groupId, "entryId": entryId})
                      return {"statusCode": 200, "headers": CORS_HEADERS, "body": json.dumps(get_items(groupId))}

                  return {"statusCode": 400, "headers": CORS_HEADERS, "body": json.dumps({"error": "Unsupported"})}

              except Exception as e:
                  import traceback
                  print(traceback.format_exc())
                  return {"statusCode": 500, "headers": CORS_HEADERS, "body": json.dumps({"error": str(e)})}

Outputs:
  LambdaArn:
    Value: !GetAtt KakeiboLambda.Arn
