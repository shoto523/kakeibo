AWSTemplateFormatVersion: '2010-09-09'
Description: 家計簿用 Lambda 関数と IAM ロール（CORS対応・LambdaプロキシON）

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: KakeiboLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub
                  - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                  - TableName: !ImportValue KakeiboTableName

  KakeiboLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: KakeiboLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !ImportValue KakeiboTableName
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import uuid
          from boto3.dynamodb.conditions import Key
          from decimal import Decimal

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          CORS_HEADERS = {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "OPTIONS,GET,POST,DELETE"
          }

          def convert_decimal(obj):
              if isinstance(obj, list):
                  return [convert_decimal(i) for i in obj]
              if isinstance(obj, dict):
                  return {k: convert_decimal(v) for k, v in obj.items()}
              if isinstance(obj, Decimal):
                  return int(obj)
              return obj

          def get_items(userId):
              resp = table.query(
                  KeyConditionExpression=Key("userId").eq(userId),
                  ConsistentRead=True
              )
              return convert_decimal(resp.get("Items", []))

          def handler(event, context):
              try:
                  method = event.get("httpMethod")

                  if method == "OPTIONS":
                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": ""
                      }

                  request_context = event.get("requestContext") or {}
                  authorizer = request_context.get("authorizer") or {}
                  claims = authorizer.get("claims")

                  if not claims:
                      return {
                          "statusCode": 401,
                          "headers": CORS_HEADERS,
                          "body": json.dumps({"error": "Unauthorized"})
                      }

                  # ★ ここが重要：sub → cognito:username
                  userId = claims["cognito:username"]

                  if method == "GET":
                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": json.dumps(get_items(userId))
                      }

                  if method == "POST":
                      body = json.loads(event.get("body") or "{}")
                      table.put_item(
                          Item={
                              "userId": userId,
                              "entryId": str(uuid.uuid4()),
                              "date": body.get("date"),
                              "item": body.get("item"),
                              "amount": Decimal(str(body.get("amount")))
                          }
                      )
                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": json.dumps(get_items(userId))
                      }

                  if method == "DELETE":
                      entryId = (event.get("pathParameters") or {}).get("id")
                      if not entryId:
                          return {
                              "statusCode": 400,
                              "headers": CORS_HEADERS,
                              "body": json.dumps({"error": "id is required"})
                          }

                      table.delete_item(
                          Key={
                              "userId": userId,
                              "entryId": entryId
                          }
                      )

                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": json.dumps(get_items(userId))
                      }

                  return {
                      "statusCode": 400,
                      "headers": CORS_HEADERS,
                      "body": json.dumps({"error": "Unsupported method"})
                  }

              except Exception as e:
                  import traceback
                  print(traceback.format_exc())
                  return {
                      "statusCode": 500,
                      "headers": CORS_HEADERS,
                      "body": json.dumps({"error": str(e)})
                  }

Outputs:
  LambdaArn:
    Value: !GetAtt KakeiboLambda.Arn
    Export:
      Name: KakeiboLambdaArn
