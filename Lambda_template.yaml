import json
import boto3
import os
import uuid
from boto3.dynamodb.conditions import Key
from decimal import Decimal

dynamodb = boto3.resource("dynamodb")
table = dynamodb.Table(os.environ["TABLE_NAME"])

CORS_HEADERS = {
    "Access-Control-Allow-Origin": "*",
    "Access-Control-Allow-Headers": "Content-Type,Authorization",
    "Access-Control-Allow-Methods": "OPTIONS,GET,POST,DELETE"
}

def convert_decimal(obj):
    if isinstance(obj, list):
        return [convert_decimal(i) for i in obj]
    if isinstance(obj, dict):
        return {k: convert_decimal(v) for k, v in obj.items()}
    if isinstance(obj, Decimal):
        return int(obj)
    return obj

def handler(event, context):
    try:
        # ---------- HTTP Method 判定 ----------
        method = event.get("httpMethod")

        # ---------- OPTIONS（CORS preflight） ----------
        if method == "OPTIONS":
            return {
                "statusCode": 200,
                "headers": CORS_HEADERS,
                "body": ""
            }

        # ---------- Cognito 認証チェック ----------
        request_context = event.get("requestContext")
        authorizer = request_context.get("authorizer") if request_context else None
        claims = authorizer.get("claims") if authorizer else None

        if not claims:
            return {
                "statusCode": 401,
                "headers": CORS_HEADERS,
                "body": json.dumps({"error": "Unauthorized"})
            }

        userId = claims["sub"]

        # ---------- GET ----------
        if method == "GET":
            resp = table.query(
                KeyConditionExpression=Key("userId").eq(userId)
            )
            items = convert_decimal(resp.get("Items", []))
            return {
                "statusCode": 200,
                "headers": CORS_HEADERS,
                "body": json.dumps(items)
            }

        # ---------- POST ----------
        elif method == "POST":
            body = json.loads(event.get("body", "{}"))
            entryId = str(uuid.uuid4())

            table.put_item(
                Item={
                    "userId": userId,
                    "entryId": entryId,
                    "date": body.get("date"),
                    "item": body.get("item"),
                    "amount": Decimal(str(body.get("amount")))
                }
            )

            resp = table.query(
                KeyConditionExpression=Key("userId").eq(userId)
            )
            items = convert_decimal(resp.get("Items", []))

            return {
                "statusCode": 200,
                "headers": CORS_HEADERS,
                "body": json.dumps(items)
            }

        # ---------- DELETE ----------
        elif method == "DELETE":
            path_params = event.get("pathParameters") or {}
            entryId = path_params.get("id")

            if not entryId:
                return {
                    "statusCode": 400,
                    "headers": CORS_HEADERS,
                    "body": json.dumps({"error": "id is required"})
                }

            table.delete_item(
                Key={
                    "userId": userId,
                    "entryId": entryId
                }
            )

            return {
                "statusCode": 200,
                "headers": CORS_HEADERS,
                "body": json.dumps({"message": "deleted"})
            }

        # ---------- Unsupported ----------
        else:
            return {
                "statusCode": 400,
                "headers": CORS_HEADERS,
                "body": json.dumps({"error": "Unsupported method"})
            }

    except Exception as e:
        import traceback
        print(traceback.format_exc())
        return {
            "statusCode": 500,
            "headers": CORS_HEADERS,
            "body": json.dumps({"error": str(e)})
        }
