AWSTemplateFormatVersion: '2010-09-09'
Description: Kakeibo Lambda FINAL（PutItem 強制実行・詳細ログ版）

Parameters:
  KakeiboGroupTableName:
    Type: String
    Default: kakeibo-db

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: KakeiboLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${KakeiboGroupTableName}

  KakeiboLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: KakeiboLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref KakeiboGroupTableName
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import uuid
          from boto3.dynamodb.conditions import Key
          from decimal import Decimal

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          CORS_HEADERS = {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "OPTIONS,GET,POST,DELETE"
          }

          def handler(event, context):
              print("==== EVENT START ====")
              print(json.dumps(event))
              print("==== EVENT END ====")

              try:
                  method = (
                      event.get("httpMethod")
                      or event.get("requestContext", {})
                              .get("http", {})
                              .get("method")
                  )

                  print("HTTP METHOD:", method)

                  if method == "OPTIONS":
                      return {"statusCode": 200, "headers": CORS_HEADERS, "body": ""}

                  claims = event.get("requestContext", {}) \
                                .get("authorizer", {}) \
                                .get("claims")

                  print("CLAIMS:", claims)

                  if not claims:
                      raise Exception("claims not found")

                  groups = claims.get("cognito:groups")
                  if isinstance(groups, list) and groups:
                      groupId = groups[0]
                  elif isinstance(groups, str):
                      groupId = groups
                  else:
                      raise Exception("groupId not found")

                  username = claims.get("cognito:username")

                  print("GROUP_ID:", groupId)
                  print("USERNAME:", username)

                  if method == "GET":
                      resp = table.query(
                          KeyConditionExpression=Key("groupId").eq(groupId)
                      )
                      print("QUERY RESULT:", resp)
                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": json.dumps(resp.get("Items", []))
                      }

                  if method == "POST":
                      body = json.loads(event.get("body") or "{}")
                      print("POST BODY:", body)

                      item = {
                          "groupId": groupId,
                          "entryId": str(uuid.uuid4()),
                          "date": body.get("date"),
                          "item": body.get("item"),
                          "amount": Decimal(str(body.get("amount"))),
                          "registrant": username
                      }

                      print("PUT ITEM:", item)

                      table.put_item(Item=item)

                      resp = table.query(
                          KeyConditionExpression=Key("groupId").eq(groupId)
                      )

                      print("AFTER PUT QUERY:", resp)

                      return {
                          "statusCode": 200,
                          "headers": CORS_HEADERS,
                          "body": json.dumps(resp.get("Items", []))
                      }

                  return {
                      "statusCode": 400,
                      "headers": CORS_HEADERS,
                      "body": json.dumps({"error": "Unsupported method"})
                  }

              except Exception as e:
                  import traceback
                  print("ERROR:", str(e))
                  print(traceback.format_exc())
                  return {
                      "statusCode": 500,
                      "headers": CORS_HEADERS,
                      "body": json.dumps({"error": str(e)})
                  }

Outputs:
  LambdaArn:
    Value: !GetAtt KakeiboLambda.Arn
    Export:
      Name: KakeiboLambdaArn
