AWSTemplateFormatVersion: '2010-09-09'
Description: Kakeibo Lambda FINAL（kakeibo-db 固定・Cognitoグループ共有）

Parameters:
  KakeiboGroupTableName:
    Type: String
    Default: kakeibo-db

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: KakeiboLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${KakeiboGroupTableName}

  KakeiboLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: KakeiboLambda   # ★ 変更禁止
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref KakeiboGroupTableName   # ★ kakeibo-db 固定
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import uuid
          from boto3.dynamodb.conditions import Key
          from decimal import Decimal, InvalidOperation

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          CORS_HEADERS = {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Headers": "Content-Type,Authorization",
              "Access-Control-Allow-Methods": "OPTIONS,GET,POST,DELETE"
          }

          def to_json(obj):
              if isinstance(obj, list):
                  return [to_json(i) for i in obj]
              if isinstance(obj, dict):
                  return {k: to_json(v) for k, v in obj.items()}
              if isinstance(obj, Decimal):
                  return int(obj) if obj % 1 == 0 else float(obj)
              return obj

          def response(code, body):
              return {
                  "statusCode": code,
                  "headers": CORS_HEADERS,
                  "body": json.dumps(to_json(body))
              }

          def get_group_id(claims):
              groups = claims.get("cognito:groups")
              if isinstance(groups, list) and groups:
                  return groups[0]
              if isinstance(groups, str) and groups:
                  return groups
              return None

          def handler(event, context):
              method = (
                  event.get("httpMethod")
                  or event.get("requestContext", {}).get("http", {}).get("method")
              )

              if method == "OPTIONS":
                  return response(200, {})

              claims = event.get("requestContext", {}) \
                            .get("authorizer", {}) \
                            .get("claims")
              if not claims:
                  return response(401, {"error": "Unauthorized"})

              groupId = get_group_id(claims)
              if not groupId:
                  return response(400, {"error": "groupId not found"})

              username = claims.get("cognito:username")

              if method == "GET":
                  resp = table.query(
                      KeyConditionExpression=Key("groupId").eq(groupId)
                  )
                  return response(200, resp.get("Items", []))

              if method == "POST":
                  body = json.loads(event.get("body") or "{}")

                  date = body.get("date")
                  item = body.get("item")
                  amount_raw = body.get("amount")

                  if not date or not item or amount_raw is None:
                      return response(400, {"error": "date, item, amount are required"})

                  try:
                      amount = Decimal(str(amount_raw))
                  except InvalidOperation:
                      return response(400, {"error": "amount must be a number"})

                  table.put_item(
                      Item={
                          "groupId": groupId,
                          "entryId": str(uuid.uuid4()),
                          "date": date,
                          "item": item,
                          "amount": amount,
                          "registrant": username
                      }
                  )

                  resp = table.query(
                      KeyConditionExpression=Key("groupId").eq(groupId)
                  )
                  return response(200, resp.get("Items", []))

              if method == "DELETE":
                  entryId = event.get("pathParameters", {}).get("id")
                  if not entryId:
                      return response(400, {"error": "id required"})

                  item = table.get_item(
                      Key={"groupId": groupId, "entryId": entryId}
                  ).get("Item")

                  if not item:
                      return response(404, {"error": "not found"})

                  if item.get("registrant") != username:
                      return response(403, {"error": "forbidden"})

                  table.delete_item(
                      Key={"groupId": groupId, "entryId": entryId}
                  )

                  resp = table.query(
                      KeyConditionExpression=Key("groupId").eq(groupId)
                  )
                  return response(200, resp.get("Items", []))

              return response(400, {"error": "unsupported method"})

Outputs:
  LambdaArn:
    Value: !GetAtt KakeiboLambda.Arn
    Export:
      Name: KakeiboLambdaArn
