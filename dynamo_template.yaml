AWSTemplateFormatVersion: '2010-09-09'
Description: 家計簿用 DynamoDB テーブル（Cognitoグループ単位共有）

Resources:
  KakeiboTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kakeibo-db
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Outputs:
  TableName:
    Description: DynamoDB テーブル名
    Value: !Ref KakeiboTable
    Export:
      Name: KakeiboTableName
