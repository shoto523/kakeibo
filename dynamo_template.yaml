AWSTemplateFormatVersion: '2010-09-09'
Description: 家計簿用 DynamoDB テーブル（userId版 + groupId版 共存）

Resources:
  # 既存テーブル（userId / entryId）
  KakeiboTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: KakeiboTable
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # 追加テーブル（groupId / entryId）
  KakeiboGroupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: kakeibo-db
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Outputs:
  # 既存 userId テーブル
  UserTableName:
    Description: DynamoDB テーブル名（userId 単位）
    Value: !Ref KakeiboTable
    Export:
      Name: KakeiboTableName

  # 新 groupId テーブル
  GroupTableName:
    Description: DynamoDB テーブル名（groupId 単位）
    Value: !Ref KakeiboGroupTable
    Export:
      Name: KakeiboGroupTableName
