AWSTemplateFormatVersion: '2010-09-09'
Description: 家計簿用 DynamoDB テーブル（groupId版 のみ）

Resources:
  # 追加テーブル（groupId / entryId）
  KakeiboGroupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: kakeibo-db
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Outputs:
  # 新 groupId テーブル
  GroupTableName:
    Description: DynamoDB テーブル名（groupId 単位）
    Value: !Ref KakeiboGroupTable
    Export:
      Name: KakeiboGroupTableName
