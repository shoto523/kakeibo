<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>家計簿アプリ</title>

<style>
body { font-family: Arial; max-width: 700px; margin: auto; padding: 20px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 8px; }
th { background-color: #f0f0f0; }
input, button { padding: 5px; margin: 5px 0; }
a { color: blue; cursor: pointer; text-decoration: underline; }
</style>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.7/dist/amazon-cognito-identity.min.js"></script>
</head>

<body>
<h1>家計簿アプリ</h1>

<!-- ログイン -->
<div id="login-section">
  <h2>ログイン</h2>
  <input type="text" id="username" placeholder="ユーザー名"><br>
  <input type="password" id="password" placeholder="パスワード"><br>
  <button onclick="login()">ログイン</button><br>
  <!-- ★ 追加 -->
  <a onclick="showForgot()">パスワードを忘れた場合</a>
  <p id="login-msg" style="color:red;"></p>
</div>

<!-- ★ パスワード再設定 -->
<div id="forgot-section" style="display:none;">
  <h2>パスワード再設定</h2>
  <input type="text" id="fp-username" placeholder="ユーザー名"><br>
  <button onclick="sendCode()">確認コード送信</button><br><br>

  <input type="text" id="fp-code" placeholder="確認コード"><br>
  <input type="password" id="fp-new-password" placeholder="新しいパスワード"><br>
  <button onclick="resetPassword()">パスワード更新</button>

  <p id="fp-msg" style="color:red;"></p>
  <a onclick="backToLogin()">ログインに戻る</a>
</div>

<!-- アプリ本体 -->
<div id="app-section" style="display:none;">
  <h2>家計簿 - <span id="current-user"></span></h2>

  <input type="date" id="date">
  <input type="text" id="item" placeholder="項目">
  <input type="number" id="amount" placeholder="金額">
  <button onclick="addEntry()">追加</button>

  <table>
    <thead>
      <tr>
        <th>日付</th>
        <th>項目</th>
        <th>金額</th>
      </tr>
    </thead>
    <tbody id="entries"></tbody>
  </table>

  <button onclick="logout()">ログアウト</button>
</div>

<script>
// =======================
// Cognito 設定
// =======================
const poolData = {
  UserPoolId: 'ap-northeast-1_ryB6uosGw',
  ClientId: 'ajrs1d53o18dvfcq0mnkqc49m'
};
const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

let currentUser = null;
let forgotUser = null; // ★ 追加

// =======================
// API Gateway
// =======================
const API_ENDPOINT =
  'https://k2yg0wxlel.execute-api.ap-northeast-1.amazonaws.com/dev/kakeibo';

// =======================
// ログイン
// =======================
function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    document.getElementById('login-msg').innerText = '入力してください';
    return;
  }

  const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
    Username: username,
    Pool: userPool
  });

  const authDetails =
    new AmazonCognitoIdentity.AuthenticationDetails({
      Username: username,
      Password: password
    });

  cognitoUser.authenticateUser(authDetails, {
    onSuccess: function (result) {
      currentUser = cognitoUser;
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('app-section').style.display = 'block';
      document.getElementById('current-user').innerText = username;
      loadEntries(result.getIdToken().getJwtToken());
    },

    onFailure: function (err) {
      document.getElementById('login-msg').innerText = err.message;
    },

    newPasswordRequired: function () {
      const newPassword = prompt('新しいパスワードを入力してください');
      cognitoUser.completeNewPasswordChallenge(newPassword, {}, this);
    }
  });
}

// =======================
// ★ パスワード忘れ
// =======================
function showForgot() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('forgot-section').style.display = 'block';
}

function backToLogin() {
  document.getElementById('forgot-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'block';
}

function sendCode() {
  const username = document.getElementById('fp-username').value.trim();
  if (!username) return;

  forgotUser = new AmazonCognitoIdentity.CognitoUser({
    Username: username,
    Pool: userPool
  });

  forgotUser.forgotPassword({
    onSuccess: function () {
      document.getElementById('fp-msg').innerText =
        '確認コードを送信しました';
    },
    onFailure: function (err) {
      document.getElementById('fp-msg').innerText = err.message;
    }
  });
}

function resetPassword() {
  const code = document.getElementById('fp-code').value.trim();
  const newPassword =
    document.getElementById('fp-new-password').value.trim();

  forgotUser.confirmPassword(code, newPassword, {
    onSuccess: function () {
      alert('パスワードを更新しました');
      backToLogin();
    },
    onFailure: function (err) {
      document.getElementById('fp-msg').innerText = err.message;
    }
  });
}

// =======================
// ログアウト
// =======================
function logout() {
  if (currentUser) currentUser.signOut();
  currentUser = null;
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('app-section').style.display = 'none';
}

// =======================
// API
// =======================
async function loadEntries(token) {
  const res = await fetch(API_ENDPOINT, {
    headers: { Authorization: token }
  });
  renderEntries(await res.json());
}

async function addEntry() {
  const token = currentUser
    .getSignInUserSession()
    .getIdToken()
    .getJwtToken();

  const res = await fetch(API_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: token
    },
    body: JSON.stringify({
      date: date.value,
      item: item.value,
      amount: Number(amount.value)
    })
  });

  renderEntries(await res.json());
}

// =======================
// 表示
// =======================
function renderEntries(entries) {
  const tbody = document.getElementById('entries');
  tbody.innerHTML = '';
  entries.forEach(e => {
    tbody.innerHTML +=
      `<tr><td>${e.date}</td><td>${e.item}</td><td>${e.amount}</td></tr>`;
  });
}
</script>
</body>
</html>
